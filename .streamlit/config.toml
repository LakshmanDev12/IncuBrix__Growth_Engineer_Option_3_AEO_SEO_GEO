[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#090d16"
secondaryBackgroundColor = "#111827"
textColor = "#f9fafb"
borderColor = "#1f2937"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.dark]
primaryColor = "#8b5cf6"
backgroundColor = "#090d16"
secondaryBackgroundColor = "#111827"
textColor = "#f9fafb"
borderColor = "#1f2937"

[theme.dark.sidebar]
backgroundColor = "#070a10"
secondaryBackgroundColor = "#111827"
textColor = "#f9fafb"
borderColor = "#1f2937"

[theme.light]
primaryColor = "#7c3aed"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.light.sidebar]
backgroundColor = "#f1f5f9"
secondaryBackgroundColor = "#e2e8f0"
textColor = "#0f172a"
borderColor = "#cbd5e1"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
